<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Kitchen-sink playground for @amritk/mini-native — Lynx elements, CSS, lists, events, control flow, forms and data, previewed through a DOM implementation of Lynx's Element PAPI."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2334d399'/%3E%3Ctext x='16' y='23' font-family='system-ui' font-size='17' font-weight='700' text-anchor='middle' fill='%23052e1c'%3Emn%3C/text%3E%3C/svg%3E"
    />
    <title>mini-native — playground</title>
    <!--
      Page-level CSS only: the background, the device-shaped viewport, and the
      overlay layer a Portal targets. Everything inside #app is Lynx elements
      styled by `src/styles.css`, which is CSS the engine itself supports — and
      the rules that make a BROWSER lay out like Lynx live with the preview
      engine in `src/lib/`, not here, so `styles.css` stays shippable.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #e9ecf2;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #05070c;
        }
      }

      /* A device-shaped viewport on a desktop, and the whole window on a phone
         — the app inside is identical either way. */
      #app {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 480px;
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
      }

      @media (min-width: 560px) and (min-height: 720px) {
        #app {
          height: min(880px, calc(100dvh - 48px));
          margin: 24px auto;
          border-radius: 28px;
          box-shadow: 0 24px 60px rgb(0 0 0 / 0.28);
        }
      }

      /* The overlay layer is inert until a Portal puts something in it. */
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        pointer-events: none;
        z-index: 10;
      }

      #overlay > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Where <Portal> puts overlays: a sibling of the app root, owned by the
         app rather than by the host — see src/screens/composition.tsx. -->
    <div id="overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
