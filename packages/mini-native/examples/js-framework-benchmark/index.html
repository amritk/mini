<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mini-native — js-framework-benchmark (keyed)</title>
    <style>
      /*
        Hand-written rather than Bootstrap, because the whole premise is that
        this screen is written in a native vocabulary: every rule here is a
        class the same component would carry on a device, so nothing about the
        layout depends on being in a browser. The DOM host's own layout reset
        does the rest — it is what makes an unstyled container stack the way
        Yoga would rather than the way CSS would.
      */
      body {
        margin: 0;
        font: 14px/1.4 system-ui, sans-serif;
      }
      .benchmark {
        padding: 16px;
        gap: 16px;
      }
      .controls {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 8px;
      }
      .controls > * {
        padding: 8px 12px;
        border: 1px solid #ccd;
        border-radius: 6px;
        background: #f6f7fb;
        cursor: pointer;
      }
      .rows {
        height: 70vh;
      }
      .row {
        flex-direction: row;
        gap: 12px;
        padding: 6px 4px;
        border-bottom: 1px solid #eee;
      }
      .row.danger {
        background: #fde2e2;
      }
      .col-id {
        width: 64px;
        color: #888;
      }
      .col-label {
        flex-grow: 1;
      }
      .col-remove {
        cursor: pointer;
        color: #b00;
      }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <script type="module" src="./bootstrap.ts"></script>
  </body>
</html>
