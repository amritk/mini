name: Deploy playground

on:
  push:
    branches:
      - main
    paths:
      - "playground/**"
      - "src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-playground.yml"
  # The playground is also the fastest way to look at a change by hand, so a
  # manual run can point at any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy playground
    runs-on: ubuntu-latest
    # Nothing to deploy to without a token. Skipping keeps a fork (and a
    # checkout that has never been wired to Cloudflare) green rather than red
    # for a reason that is not about the code.
    if: ${{ github.repository == 'amritk/niv' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The playground resolves the package straight from `src` (see
      # playground/vite.config.ts), so no package build is needed first. Worth
      # the seconds: a broken playground should fail here rather than deploy.
      - name: Type check
        run: bun run types:check

      - name: Build
        run: bun run playground:build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `build` already ran above, so this only uploads. Run from the root,
          # where wrangler is installed; the config's paths are relative to it.
          command: deploy --config playground/wrangler.jsonc
