name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Check the called-signal footgun
        run: bun run check:reactivity

      # Regenerating `llms.txt` catches a stale bundle, but a stale *source*
      # regenerates perfectly: an `AI.md` that never mentions the subpath a
      # release added is wrong in a way no diff can see. This reads what the
      # package actually exports and asks whether `AI.md` says so.
      - name: Check AI docs match what the package publishes
        run: bun run check:ai-docs

      # `llms.txt` and `llms-full.txt` are generated from `AI.md` and committed,
      # so they go stale in exactly the way a committed build artifact always
      # does: silently, and only for the audience that cannot complain.
      # Regenerating and diffing is the whole guard.
      - name: Check generated LLM docs are current
        run: |
          bun run generate-llms
          git diff --exit-code llms.txt llms-full.txt

      - name: Build
        run: bun run build

      # Covers the package and the playground, which is the one place the
      # package is used the way a consumer uses it.
      - name: Type check
        run: bun run types:check

      # vitest.config.ts aliases the package to its `src/`, so the suite needs
      # no build.
      - name: Test
        run: bun run test

      # A broken playground should fail here rather than at deploy.
      - name: Build playground
        run: bun run playground:build

      # Loads every compiled module under plain Node and installs a packed
      # tarball like an npm consumer — catches build-, pack- and manifest-level
      # corruption the src-aliased tests cannot see.
      - name: Smoke and e2e test built artifacts
        run: bun run test:dist
