name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check

      - name: Check mini reactivity footgun
        run: bun run check:reactivity

      - name: Type check
        run: bun run types:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Loads every compiled module under plain Node and drives the built
      # mini-native runtime end-to-end through its memory host — catches build
      # and pack-step corruption the src-aliased tests cannot see.
      - name: Smoke test built artifacts
        run: bun run test:dist
